services:
  - type: web
    runtime: docker
    name: mathhomeworkautomarker-backend
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /var/data/mathhomeworkautomarker
      sizeGB: 1
    envVars:
      - key: APP_DATA_DIR
        value: /var/data/mathhomeworkautomarker
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: GRADING_PROVIDER
        value: doubao
      - key: DOUBAO_VISION_MODEL
        value: doubao-seed-2-1-turbo-260628
      - key: ARK_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: FRONTEND_BASE_URL
        value: https://mathhomeworkautomarker-frontend.onrender.com
      - key: CORS_ALLOW_ORIGINS
        value: https://mathhomeworkautomarker-frontend.onrender.com

  - type: web
    runtime: static
    name: mathhomeworkautomarker-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mathhomeworkautomarker-backend.onrender.com
